<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel do Guincho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- TELA DE LOGIN -->
<div id="login-screen" class="screen">
  <div class="login-box">
    <div class="login-mark">
      <span class="login-mark-bar"></span>
      <h1>Painel do Guincho</h1>
    </div>
    <p class="login-sub">Entre com sua conta para acompanhar o serviço.</p>
    <form id="login-form">
      <label>
        E-mail
        <input type="email" id="login-email" required autocomplete="username">
      </label>
      <label>
        Senha
        <input type="password" id="login-password" required autocomplete="current-password">
      </label>
      <button type="submit" class="btn btn-primary btn-full">Entrar</button>
      <p id="login-error" class="form-error" hidden></p>
    </form>
  </div>
</div>

<!-- PAINEL -->
<div id="dashboard" class="screen" hidden>

  <header class="topbar">
    <div class="topbar-title">
      <span class="topbar-bar"></span>
      <h1>Painel do Guincho</h1>
    </div>
    <div class="topbar-actions">
      <span id="user-email" class="user-email"></span>
      <button id="btn-logout" class="btn btn-ghost">Sair</button>
    </div>
  </header>

  <section class="summary">
    <div class="summary-item">
      <span class="summary-label">Faturamento total</span>
      <span class="summary-value" id="sum-total">R$ 0</span>
    </div>
    <div class="summary-item summary-ok">
      <span class="summary-label">Pago</span>
      <span class="summary-value" id="sum-pago">R$ 0</span>
    </div>
    <div class="summary-item summary-pending">
      <span class="summary-label">Pendente</span>
      <span class="summary-value" id="sum-pendente">R$ 0</span>
    </div>
    <div class="summary-item">
      <span class="summary-label">Carros atendidos</span>
      <span class="summary-value" id="sum-count">0</span>
    </div>
  </section>

  <section class="toolbar">
    <div class="filters" id="filters">
      <button class="filter-btn active" data-filter="todos">Todos</button>
      <button class="filter-btn" data-filter="pendente">Pendentes</button>
      <button class="filter-btn" data-filter="pago">Pagos</button>
    </div>
    <button id="btn-new" class="btn btn-primary">+ Novo guincho</button>
  </section>

  <section id="cards-container" class="cards-container"></section>

  <p id="empty-state" class="empty-state" hidden>Nenhum guincho registrado ainda. Clique em "+ Novo guincho" para começar.</p>

</div>

<!-- MODAL: NOVO / EDITAR GUINCHO -->
<div id="modal-backdrop" class="modal-backdrop" hidden>
  <div class="modal">
    <div class="modal-head">
      <h2 id="modal-title">Novo guincho</h2>
      <button id="modal-close" class="modal-close" aria-label="Fechar">&times;</button>
    </div>
    <form id="form-guincho">
      <input type="hidden" id="edit-id">
      <div class="field-row">
        <label>
          Modelo do carro
          <input type="text" id="f-modelo" placeholder="Ex: Fiat Uno" required>
        </label>
        <label>
          Placa
          <input type="text" id="f-placa" placeholder="Ex: ABC1D23" required>
        </label>
      </div>
      <div class="field-row">
        <label>
          Valor do guincho (R$)
          <input type="number" id="f-valor" placeholder="0,00" step="0.01" min="0" required>
        </label>
        <label>
          Data
          <input type="date" id="f-data" required>
        </label>
      </div>
      <label>
        Local de retirada
        <input type="text" id="f-retirada" placeholder="Ex: Av. Brasil, 500" required>
      </label>
      <label>
        Local de entrega
        <input type="text" id="f-entrega" placeholder="Ex: Oficina Central" required>
      </label>
      <label class="checkbox-line">
        <input type="checkbox" id="f-pago">
        Já foi pago
      </label>
      <div class="modal-actions">
        <button type="button" id="btn-delete" class="btn btn-danger" hidden>Excluir</button>
        <button type="submit" class="btn btn-primary">Salvar</button>
      </div>
      <p id="form-error" class="form-error" hidden></p>
    </form>
  </div>
</div>

<!-- Firebase SDK -->
<script type="module" src="js/firebase-config.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
